<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Centro de verificación de documentos." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#070910" />
    <meta property="og:title" content="Verification Center" />
    <meta property="og:description" content="Centro de verificación de documentos." />
    <title>Verification Center</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23070910'/%3E%3Cpath d='M8 16.5l5 5 11-12' fill='none' stroke='%23c6aa78' stroke-width='2'/%3E%3C/svg%3E" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient" id="ambient" hidden>
      <canvas id="field" aria-hidden="true"></canvas>
      <div class="petals" id="petals"></div>
      <div class="sparks" id="sparks"></div>
      <div class="ornaments" aria-hidden="true">
        <svg class="ornament ornament-a" viewBox="0 0 200 260" fill="none">
          <path d="M104 248c0-62-34-78-24-124" stroke="#c6aa78" stroke-width="1.2" />
          <path d="M90 176c-28-6-42-28-24-44" stroke="#8d3a48" stroke-width="1" />
          <path d="M108 154c26-8 40-30 20-46" stroke="#8d3a48" stroke-width="1" />
          <ellipse cx="100" cy="78" rx="26" ry="34" transform="rotate(-24 100 78)" stroke="#f0d5d4" stroke-width="1.15" />
          <ellipse cx="100" cy="78" rx="26" ry="34" transform="rotate(32 100 78)" stroke="#c48990" stroke-width="1.15" />
          <ellipse cx="100" cy="78" rx="18" ry="24" stroke="#f7ece4" stroke-width="1.1" />
          <circle cx="100" cy="78" r="5.5" fill="#7a3140" />
        </svg>
        <svg class="ornament ornament-b" viewBox="0 0 200 260" fill="none">
          <path d="M104 248c0-62-34-78-24-124" stroke="#c6aa78" stroke-width="1.2" />
          <path d="M90 176c-28-6-42-28-24-44" stroke="#8d3a48" stroke-width="1" />
          <path d="M108 154c26-8 40-30 20-46" stroke="#8d3a48" stroke-width="1" />
          <ellipse cx="100" cy="78" rx="26" ry="34" transform="rotate(-24 100 78)" stroke="#f0d5d4" stroke-width="1.15" />
          <ellipse cx="100" cy="78" rx="26" ry="34" transform="rotate(32 100 78)" stroke="#c48990" stroke-width="1.15" />
          <ellipse cx="100" cy="78" rx="18" ry="24" stroke="#f7ece4" stroke-width="1.1" />
          <circle cx="100" cy="78" r="5.5" fill="#7a3140" />
        </svg>
        <svg class="ornament ornament-c" viewBox="0 0 200 260" fill="none">
          <path d="M96 248c0-62 34-78 24-124" stroke="#c6aa78" stroke-width="1.2" />
          <path d="M110 176c28-6 42-28 24-44" stroke="#8d3a48" stroke-width="1" />
          <path d="M92 154c-26-8-40-30-20-46" stroke="#8d3a48" stroke-width="1" />
          <ellipse cx="100" cy="86" rx="24" ry="32" transform="rotate(18 100 86)" stroke="#f0d5d4" stroke-width="1.15" />
          <ellipse cx="100" cy="86" rx="24" ry="32" transform="rotate(-36 100 86)" stroke="#c48990" stroke-width="1.15" />
          <ellipse cx="100" cy="86" rx="16" ry="22" stroke="#f7ece4" stroke-width="1.1" />
          <circle cx="100" cy="86" r="5" fill="#7a3140" />
        </svg>
        <svg class="ornament ornament-d" viewBox="0 0 200 260" fill="none">
          <path d="M96 248c0-62 34-78 24-124" stroke="#c6aa78" stroke-width="1.2" />
          <path d="M110 176c28-6 42-28 24-44" stroke="#8d3a48" stroke-width="1" />
          <path d="M92 154c-26-8-40-30-20-46" stroke="#8d3a48" stroke-width="1" />
          <ellipse cx="100" cy="86" rx="24" ry="32" transform="rotate(18 100 86)" stroke="#f0d5d4" stroke-width="1.15" />
          <ellipse cx="100" cy="86" rx="24" ry="32" transform="rotate(-36 100 86)" stroke="#c48990" stroke-width="1.15" />
          <ellipse cx="100" cy="86" rx="16" ry="22" stroke="#f7ece4" stroke-width="1.1" />
          <circle cx="100" cy="86" r="5" fill="#7a3140" />
        </svg>
      </div>
      <div class="wash"></div>
    </div>

    <main class="gate" id="gate">
      <article class="doc">
        <header class="doc-top">
          <span>Verification Center</span>
          <span>VC-2041</span>
        </header>
        <p class="eyebrow">Estado del documento</p>
        <h1>Verificación completada</h1>
        <hr class="rule" />
        <p class="sub">Hay algo que necesito entregarte personalmente.</p>
        <button class="action" id="enter" type="button">Continuar</button>
        <p class="doc-foot">Documento privado · acceso único</p>
      </article>
    </main>

    <div class="story" id="story" hidden></div>

    <button class="sound" id="sound" type="button" hidden aria-pressed="false" aria-label="Activar sonido">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path id="sound-icon" d="M4 10h3.2L11 6.2v11.6L7.2 14H4v-4zm10.2-2.2a5 5 0 0 1 0 8.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <audio id="bed" preload="none" loop playsinline></audio>
    <noscript><p class="noscript">Activa JavaScript para continuar.</p></noscript>
    <script src="script.js"></script>
  </body>
</html>
